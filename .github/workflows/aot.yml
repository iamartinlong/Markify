name: aot

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # 阶段一：JIT 基线。先证明代码本身能构建、自检能过，
  # 这样后面 AOT 失败时才能确定是 AOT 的问题，而不是代码本来就有问题。
  jit-baseline:
    name: JIT baseline
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/Markify -c Release --nologo

      - name: Self-test (JIT)
        shell: pwsh
        run: |
          $exe = "src/Markify/bin/Release/net10.0/Markify.exe"
          $out = "artifacts/selftest-jit.txt"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $p = Start-Process -FilePath $exe `
                 -ArgumentList '--selftest','--selftest-output',$out `
                 -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "self-test timed out" }
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: selftest-jit
          path: artifacts/selftest-jit.txt

  # 阶段二：NativeAOT 发布 + 在真实原生二进制上跑同一套自检。
  # 这是本工作流的核心：编译通过不代表 AOT 能跑，必须实际执行。
  aot-build:
    name: NativeAOT build & self-test
    needs: jit-baseline
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish NativeAOT
        run: >
          dotnet publish src/Markify -c Release -r win-x64
          -p:PublishAot=true
          -p:StripSymbols=true
          -o artifacts/aot

      - name: Report size
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts/aot -File
          $total = ($files | Measure-Object Length -Sum).Sum
          "-- total: {0:N1} MB in {1} files" -f ($total/1MB), $files.Count | Write-Host
          $files | Sort-Object Length -Descending |
            Select-Object -First 5 Name, @{n='MB';e={'{0:N1}' -f ($_.Length/1MB)}} |
            Format-Table | Out-String | Write-Host
          "-- Markify.exe: {0:N1} MB" -f ((Get-Item artifacts/aot/Markify.exe).Length/1MB) | Write-Host

      - name: Self-test (AOT)
        shell: pwsh
        run: |
          $exe = "artifacts/aot/Markify.exe"
          $out = "artifacts/selftest-aot.txt"
          $p = Start-Process -FilePath $exe `
                 -ArgumentList '--selftest','--selftest-output',$out `
                 -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "AOT self-test timed out" }
          if (Test-Path $out) { Get-Content $out } else { throw "no self-test report produced" }
          if ($p.ExitCode -ne 0) { throw "AOT self-test failed with exit code $($p.ExitCode)" }

          # 确证跑的是 AOT 产物而不是回落到了 JIT 版本：报告里必须标记 isAot=yes。
          $report = Get-Content $out -Raw
          if ($report -notmatch 'isAot \(approx\): yes') {
            throw "self-test did not run under NativeAOT (isAot flag missing)"
          }
          Write-Host "confirmed: self-test ran under NativeAOT"

      - name: Verify native output layout
        shell: pwsh
        run: |
          # 校验 AOT 产物形态。
          # 注意：不能简单地"存在 .dll 就失败"——libSkiaSharp/libHarfBuzzSharp/libonigwrap/
          # av_libglesv2 都是原生库，AOT 应用本来就依赖它们。真正的判据是：
          # 应用自身的托管程序集（Markify.dll、Avalonia*.dll 等）不应出现。
          if (-not (Test-Path artifacts/aot/Markify.exe)) { throw "Markify.exe missing" }

          $dlls = Get-ChildItem artifacts/aot -Filter *.dll -File
          $nativeAllow = @('libSkiaSharp.dll','libHarfBuzzSharp.dll','libonigwrap.dll','av_libglesv2.dll')
          $unexpected = $dlls | Where-Object { $nativeAllow -notcontains $_.Name }

          if ($unexpected) {
            Write-Host "Unexpected DLLs in AOT output:"
            $unexpected | Select-Object Name, @{n='MB';e={'{0:N1}' -f ($_.Length/1MB)}} |
              Format-Table | Out-String | Write-Host
            throw "AOT output contains non-native DLLs (likely a managed assembly leaked through)"
          }

          # 托管程序集必然带 CLR 头；这里抽查 Markify 自身是否已被编译进 exe。
          if (Test-Path artifacts/aot/Markify.dll) { throw "Markify.dll should not exist in an AOT build" }

          Write-Host "OK: Markify.exe is native, only known native dependencies remain"
          Write-Host ("native dlls: " + (($dlls | ForEach-Object Name) -join ', '))

      - name: Report runtime footprint (excluding symbols)
        shell: pwsh
        run: |
          # PDB 体积很大但不随发布分发，单独统计，避免误导"体积优化"的判断。
          $all = Get-ChildItem artifacts/aot -File
          $runtime = $all | Where-Object { $_.Extension -ne '.pdb' }
          $symbols = $all | Where-Object { $_.Extension -eq '.pdb' }
          "-- runtime (no pdb): {0:N1} MB in {1} files" -f (($runtime | Measure-Object Length -Sum).Sum/1MB), $runtime.Count | Write-Host
          "-- symbols (pdb)  : {0:N1} MB in {1} files" -f (($symbols | Measure-Object Length -Sum).Sum/1MB), $symbols.Count | Write-Host
          $runtime | Sort-Object Length -Descending |
            Select-Object Name, @{n='MB';e={'{0:N2}' -f ($_.Length/1MB)}} |
            Format-Table | Out-String | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: selftest-aot
          path: artifacts/selftest-aot.txt

      - uses: actions/upload-artifact@v4
        with:
          name: markify-win-x64-aot
          path: artifacts/aot/
